<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给 Lily 的生日礼物</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root {
  --bg-deep: #0a0a1a;
  --bg-mid: #140a28;
  --rose: #ff6b9d;
  --rose-light: #ff8fab;
  --rose-pale: #ffc2d4;
  --gold: #ffd700;
  --gold-soft: #ffe4a0;
  --text-warm: #fff5f5;
  --text-dim: rgba(255,245,245,0.6);
  --text-faint: rgba(255,245,245,0.35);
  --panda-red: #d42828;
  --panda-gold: #ffd700;
  --serif: 'Noto Serif SC','Songti SC','SimSun',serif;
  --sans: 'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg-deep); color:var(--text-warm); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

/* ===== 背景层 ===== */
#meteor-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
#confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:100; pointer-events:none; display:none; }
.gradient-overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none;
  background: radial-gradient(ellipse at 20% 80%, rgba(255,107,157,0.08) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 20%, rgba(255,215,0,0.06) 0%, transparent 50%); }

/* ===== 音乐控制 ===== */
#music-toggle { position:fixed; top:20px; right:20px; z-index:200; width:44px; height:44px; border-radius:50%;
  border:1px solid rgba(255,194,212,0.3); background:rgba(20,10,40,0.6); backdrop-filter:blur(8px);
  cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .3s; opacity:0; pointer-events:none; }
#music-toggle.visible { opacity:1; pointer-events:auto; }
#music-toggle:hover { border-color:var(--rose-light); background:rgba(255,107,157,0.15); transform:scale(1.08); }
#music-toggle svg { width:20px; height:20px; fill:var(--rose-pale); }

/* ===== 视图容器 ===== */
.view { position:fixed; top:0; left:0; width:100%; height:100%; z-index:10; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:40px 24px; opacity:0; visibility:hidden; transition:opacity .8s ease, visibility .8s ease; }
.view.active { opacity:1; visibility:visible; }

/* ===== 小熊猫场景 ===== */
.panda-scene { position:relative; width:100%; max-width:500px; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.panda-container { position:relative; width:280px; height:340px; margin-bottom:20px; animation:pandaFloat 3s ease-in-out infinite; }
@keyframes pandaFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.panda-container.nodding { animation:pandaNod 1.5s ease-in-out infinite; }
@keyframes pandaNod { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }

/* 小熊猫 SVG 各部分动画 */
.panda-svg { width:100%; height:100%; }
.panda-eye { transition:all .2s ease; transform-origin:center; transform-box:fill-box; }
.panda-container.wink .panda-eye.right { transform:scaleY(0.1); }
.panda-container.big-smile .panda-eye { transform:scaleY(0.3); }
.panda-container.sad .panda-eye { transform:scaleY(0.7); }
.panda-mouth { transition:all .3s ease; }
.panda-container.big-smile .panda-mouth { d:path("M120 175 Q150 210 180 175"); }
.panda-container.sad .panda-mouth { d:path("M125 190 Q150 170 175 190"); }
.panda-tongue { transition:all .3s ease; }
.panda-container.sad .panda-tongue { opacity:0; }
.panda-brow { opacity:0; transition:all .3s ease; }
.panda-container.sad .panda-brow { opacity:1; }

/* 手臂动画 */
.panda-arm { transition:all .5s ease; transform-origin:top center; transform-box:fill-box; }
.panda-container.waving .panda-arm.right { animation:waveArm 0.8s ease-in-out infinite; }
@keyframes waveArm { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-30deg)} }
.panda-container.giving-key .panda-arm.right { transform:rotate(-50deg) translateY(-10px); }

/* 钥匙 */
.key-container { position:absolute; right:-30px; top:45%; opacity:0; transition:all .6s ease; transform:scale(0); }
.panda-container.giving-key .key-container { opacity:1; transform:scale(1); animation:keyGlow 1.5s ease-in-out infinite; }
@keyframes keyGlow { 0%,100%{filter:drop-shadow(0 0 10px rgba(255,215,0,0.6))} 50%{filter:drop-shadow(0 0 25px rgba(255,215,0,0.9))} }
.key-container svg { width:70px; height:100px; cursor:pointer; }
.key-hint { position:absolute; bottom:-25px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--gold-soft); white-space:nowrap; letter-spacing:1px; }

/* 对话框 */
.dialog-box { position:relative; max-width:380px; width:100%; background:rgba(20,10,40,0.85); border:1px solid rgba(255,194,212,0.3);
  border-radius:20px; padding:24px 28px; backdrop-filter:blur(10px); margin-top:10px;
  box-shadow:0 8px 40px rgba(255,107,157,0.15); opacity:0; transform:translateY(20px); transition:all .5s ease; }
.dialog-box.show { opacity:1; transform:translateY(0); }
.dialog-box::before { content:''; position:absolute; top:-12px; left:50%; transform:translateX(-50%) rotate(45deg);
  width:20px; height:20px; background:rgba(20,10,40,0.85); border-left:1px solid rgba(255,194,212,0.3); border-top:1px solid rgba(255,194,212,0.3); }
.dialog-text { font-family:var(--serif); font-size:16px; line-height:2; color:var(--text-warm); letter-spacing:1px; min-height:60px; }
.dialog-text .char { opacity:0; display:inline-block; animation:charFade .3s ease forwards; }
@keyframes charFade { from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:translateY(0)} }

/* 对话选项 */
.dialog-options { display:flex; gap:16px; justify-content:center; margin-top:20px; opacity:0; transition:opacity .5s ease; }
.dialog-options.show { opacity:1; }
.option-btn { padding:14px 40px; border-radius:50px; font-size:16px; font-family:var(--serif); font-weight:700; letter-spacing:2px;
  cursor:pointer; transition:all .3s ease; border:2px solid; }
.option-btn.yes { background:linear-gradient(135deg,var(--rose),var(--rose-light)); border-color:var(--rose); color:#fff;
  box-shadow:0 4px 20px rgba(255,107,157,0.4); }
.option-btn.yes:hover { transform:translateY(-2px) scale(1.05); box-shadow:0 8px 30px rgba(255,107,157,0.6); }
.option-btn.no { background:transparent; border-color:rgba(255,194,212,0.4); color:var(--text-dim); }
.option-btn.no:hover { border-color:var(--rose-pale); color:var(--rose-pale); transform:scale(1.05); }

/* 开场提示 */
.opening-hint { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); font-size:13px; color:var(--text-faint);
  letter-spacing:2px; animation:hintBlink 2s ease-in-out infinite; }
@keyframes hintBlink { 0%,100%{opacity:0.3} 50%{opacity:0.8} }

/* ===== 选择题 ===== */
.quiz-container { width:100%; max-width:480px; text-align:center; }
.quiz-progress { font-size:13px; color:var(--rose-pale); letter-spacing:2px; margin-bottom:16px; opacity:0.8; }
.quiz-question { font-family:var(--serif); font-size:22px; font-weight:700; color:var(--text-warm); line-height:1.8;
  margin-bottom:32px; letter-spacing:1px; min-height:80px; }
.quiz-options { display:flex; flex-direction:column; gap:14px; }
.quiz-option { padding:16px 24px; border:1px solid rgba(255,194,212,0.25); border-radius:14px; background:rgba(20,10,40,0.6);
  color:var(--text-warm); font-size:16px; font-family:var(--serif); font-weight:600; letter-spacing:1px; cursor:pointer;
  transition:all .3s ease; text-align:left; position:relative; overflow:hidden; }
.quiz-option:hover { border-color:var(--rose); background:rgba(255,107,157,0.12); transform:translateX(6px); }
.quiz-option.correct { border-color:#4ade80; background:rgba(74,222,128,0.15); color:#86efac; }
.quiz-option.wrong { border-color:#f87171; background:rgba(248,113,113,0.15); color:#fca5a5; animation:shake .4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
.quiz-option .opt-label { display:inline-block; width:28px; color:var(--rose); font-weight:700; }
.quiz-feedback { margin-top:24px; font-size:15px; min-height:24px; font-family:var(--serif); letter-spacing:1px; transition:all .3s; }
.quiz-feedback.success { color:#86efac; }
.quiz-feedback.error { color:#fca5a5; }

/* 答对庆祝小熊猫 */
.quiz-celebration { margin:0 auto 20px; width:120px; height:140px; opacity:0; transform:scale(0); transition:all .5s ease; }
.quiz-celebration.show { opacity:1; transform:scale(1); }

/* ===== 回忆展示（保留原有） ===== */
.memories-wrapper { width:100%; max-width:900px; height:100%; display:flex; flex-direction:column; justify-content:center; position:relative; }
.memory-stage { position:relative; width:100%; aspect-ratio:16/10; border-radius:20px; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 80px rgba(255,107,157,0.1); background:var(--bg-mid); }
.memory-slide { position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; transition:opacity 1s ease; display:flex; align-items:center; justify-content:center; }
.memory-slide.active { opacity:1; }
.memory-slide img,.memory-slide video { width:100%; height:100%; object-fit:cover; }
.memory-placeholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:40px; }
.memory-placeholder-icon { width:56px; height:56px; opacity:0.5; }
.memory-placeholder-icon svg { width:100%; height:100%; stroke:var(--rose-pale); fill:none; stroke-width:1.2; }
.memory-placeholder-text { font-family:var(--serif); font-size:18px; color:var(--text-dim); letter-spacing:2px; }
.memory-placeholder-hint { font-size:12px; color:var(--text-faint); letter-spacing:1px; }
.ph-1{background:linear-gradient(135deg,#1a0a2e,#2d1b4e,#1a0a2e)} .ph-2{background:linear-gradient(135deg,#2e0a1a,#4e1b2d,#2e0a1a)}
.ph-3{background:linear-gradient(135deg,#0a1a2e,#1b2d4e,#0a1a2e)} .ph-4{background:linear-gradient(135deg,#2e2a0a,#4e451b,#2e2a0a)}
.ph-5{background:linear-gradient(135deg,#1a2e0a,#2d4e1b,#1a2e0a)} .ph-6{background:linear-gradient(135deg,#2e0a2e,#4e1b4e,#2e0a2e)}
.memory-caption { position:absolute; bottom:0; left:0; right:0; padding:40px 32px 28px; background:linear-gradient(transparent,rgba(10,10,26,0.85)); z-index:5; }
.memory-caption-title { font-family:var(--serif); font-size:20px; font-weight:700; color:var(--text-warm); margin-bottom:6px; letter-spacing:1px; }
.memory-caption-desc { font-size:14px; color:var(--text-dim); line-height:1.7; letter-spacing:0.5px; }
.memory-caption-date { position:absolute; top:20px; right:24px; font-size:12px; color:var(--rose-pale); letter-spacing:2px; opacity:0.8; }
.memory-nav { display:flex; align-items:center; justify-content:space-between; margin-top:24px; padding:0 8px; }
.memory-arrow { width:48px; height:48px; border-radius:50%; border:1px solid rgba(255,194,212,0.25); background:rgba(20,10,40,0.6);
  color:var(--rose-pale); font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .3s; flex-shrink:0; }
.memory-arrow:hover { border-color:var(--rose); background:rgba(255,107,157,0.15); transform:scale(1.1); }
.memory-arrow:disabled { opacity:0.3; cursor:not-allowed; transform:none; }
.memory-dots { display:flex; gap:10px; align-items:center; }
.memory-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,194,212,0.25); cursor:pointer; transition:all .3s; }
.memory-dot.active { background:var(--rose); width:24px; border-radius:4px; box-shadow:0 0 12px rgba(255,107,157,0.5); }
.memory-progress-text { font-size:13px; color:var(--text-dim); letter-spacing:1px; min-width:50px; text-align:center; }
.memory-finish-btn { margin-top:20px; padding:12px 36px; border:1px solid rgba(255,194,212,0.3); border-radius:50px; background:transparent;
  color:var(--text-dim); font-size:13px; font-family:var(--sans); letter-spacing:3px; cursor:pointer; transition:all .3s; align-self:center; }
.memory-finish-btn:hover { border-color:var(--rose-light); color:var(--rose-pale); background:rgba(255,107,157,0.1); }

/* ===== 结束告白（保留） ===== */
.ending-content { text-align:center; max-width:680px; width:100%; }
.ending-message { font-family:var(--serif); font-size:20px; font-weight:600; line-height:2.4; color:var(--text-warm); letter-spacing:1.5px; margin-bottom:48px; text-shadow:0 0 40px rgba(255,107,157,0.25); }
.ending-message .highlight { color:var(--rose-light); font-weight:700; }
.ending-message .gold-text { color:var(--gold); }
.ending-choices { display:flex; flex-direction:column; gap:16px; max-width:380px; margin:0 auto; }
.choice-btn { padding:18px 28px; border:1px solid rgba(255,194,212,0.3); border-radius:14px; background:rgba(20,10,40,0.5);
  color:var(--text-warm); font-size:16px; font-family:var(--serif); font-weight:600; letter-spacing:2px; cursor:pointer; transition:all .35s; text-align:left; position:relative; overflow:hidden; }
.choice-btn:hover { border-color:var(--rose); background:rgba(255,107,157,0.12); transform:translateX(6px); box-shadow:0 4px 24px rgba(255,107,157,0.2); }
.choice-btn .choice-label { display:inline-block; width:28px; color:var(--rose); font-weight:700; }

/* ===== 最终页（保留） ===== */
.final-content { text-align:center; max-width:600px; width:100%; }
.final-title { font-family:var(--serif); font-size:32px; font-weight:900; color:var(--text-warm); letter-spacing:3px; margin-bottom:20px; line-height:1.6; text-shadow:0 0 50px rgba(255,107,157,0.4); animation:finalGlow 3s ease-in-out infinite; }
@keyframes finalGlow { 0%,100%{text-shadow:0 0 30px rgba(255,107,157,0.3)} 50%{text-shadow:0 0 60px rgba(255,107,157,0.6),0 0 100px rgba(255,215,0,0.2)} }
.final-subtitle { font-size:15px; color:var(--text-dim); letter-spacing:2px; line-height:2; margin-bottom:40px; }
.final-heart { width:100px; height:100px; margin:0 auto 32px; animation:heartBeat 1.2s ease-in-out infinite; }
.final-heart svg { width:100%; height:100%; filter:drop-shadow(0 0 30px rgba(255,107,157,0.6)); }
@keyframes heartBeat { 0%,100%{transform:scale(1)} 15%{transform:scale(1.15)} 30%{transform:scale(1)} 45%{transform:scale(1.1)} 60%{transform:scale(1)} }
.final-signature { font-family:var(--serif); font-size:14px; color:var(--rose-pale); letter-spacing:4px; margin-top:24px; opacity:0.8; }

/* ===== 响应式 ===== */
@media (max-width:768px) {
  .panda-container { width:220px; height:270px; }
  .dialog-box { max-width:340px; padding:20px 22px; }
  .dialog-text { font-size:15px; }
  .quiz-question { font-size:19px; }
  .quiz-option { font-size:15px; padding:14px 20px; }
  .ending-message { font-size:17px; line-height:2.2; }
  .final-title { font-size:26px; }
  .memory-stage { aspect-ratio:4/3; }
  .memory-caption { padding:32px 20px 20px; }
  .memory-caption-title { font-size:17px; }
  .memory-arrow { width:42px; height:42px; font-size:18px; }
  .choice-btn { font-size:15px; padding:16px 22px; }
  .view { padding:30px 18px; }
}
@media (max-width:480px) {
  .panda-container { width:180px; height:220px; }
  .dialog-text { font-size:14px; line-height:1.9; }
  .quiz-question { font-size:17px; }
  .ending-message { font-size:15px; line-height:2.1; }
  .final-title { font-size:22px; }
  .memory-dots { gap:6px; }
  .memory-dot.active { width:18px; }
  .option-btn { padding:12px 32px; font-size:15px; }
}
</style>
</head>
<body>

<canvas id="meteor-canvas"></canvas>
<div class="gradient-overlay"></div>
<canvas id="confetti-canvas"></canvas>

<audio id="bg-music" loop preload="auto"><source src="" type="audio/mpeg"></audio>
<audio id="voice-audio" preload="auto"><source src="https://aka.doubaocdn.com/s/CEtbwhNdjq" type="audio/mpeg"></audio>

<button id="music-toggle" title="背景音乐" aria-label="背景音乐">
  <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
</button>

<!-- ===== 视图1：小熊猫场景（开场+对话+递钥匙） ===== -->
<section class="view active" data-route="panda" id="view-panda">
  <div class="panda-scene">
    <div class="panda-container nodding" id="panda-container">
      <svg class="panda-svg" viewBox="0 0 300 360">
        <!-- 身体（红色灯笼） -->
        <ellipse cx="150" cy="280" rx="95" ry="75" fill="#d42828"/>
        <path d="M75 230 Q70 280 75 330" stroke="#ffd700" stroke-width="2.5" fill="none" opacity="0.7"/>
        <path d="M225 230 Q230 280 225 330" stroke="#ffd700" stroke-width="2.5" fill="none" opacity="0.7"/>
        <text x="150" y="300" text-anchor="middle" fill="#ffd700" font-size="52" font-family="serif" font-weight="bold">福</text>
        <!-- 金色项圈 -->
        <ellipse cx="150" cy="205" rx="75" ry="10" fill="#ffd700"/>
        <ellipse cx="150" cy="203" rx="75" ry="6" fill="#ffed4a" opacity="0.5"/>
        <!-- 左手臂 -->
        <ellipse class="panda-arm left" cx="62" cy="265" rx="18" ry="32" fill="#fff" transform="rotate(-15 62 265)"/>
        <!-- 右手臂 -->
        <ellipse class="panda-arm right" cx="238" cy="265" rx="18" ry="32" fill="#fff" transform="rotate(15 238 265)"/>
        <!-- 头部（白色） -->
        <ellipse cx="150" cy="130" rx="90" ry="82" fill="#fff"/>
        <!-- 毛绒边缘效果 -->
        <ellipse cx="150" cy="130" rx="92" ry="84" fill="none" stroke="#fff" stroke-width="3" opacity="0.3"/>
        <!-- 黑色眼圈 -->
        <ellipse cx="108" cy="125" rx="28" ry="36" fill="#1a1a1a" transform="rotate(-12 108 125)"/>
        <ellipse cx="192" cy="125" rx="28" ry="36" fill="#1a1a1a" transform="rotate(12 192 125)"/>
        <!-- 眉毛（沮丧时显示） -->
        <path class="panda-brow" d="M88 95 L125 105" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
        <path class="panda-brow" d="M212 95 L175 105" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
        <!-- 眼睛（蓝绿色） -->
        <ellipse class="panda-eye left" cx="108" cy="125" rx="14" ry="18" fill="#4a9d9d"/>
        <ellipse class="panda-eye right" cx="192" cy="125" rx="14" ry="18" fill="#4a9d9d"/>
        <circle cx="113" cy="118" r="4.5" fill="#fff"/>
        <circle cx="197" cy="118" r="4.5" fill="#fff"/>
        <circle cx="106" cy="130" r="2" fill="#fff" opacity="0.6"/>
        <circle cx="190" cy="130" r="2" fill="#fff" opacity="0.6"/>
        <!-- 额头红点 -->
        <circle cx="150" cy="68" r="7" fill="#d42828"/>
        <circle cx="148" cy="66" r="2.5" fill="#ff6b6b" opacity="0.6"/>
        <!-- 鼻子 -->
        <ellipse cx="150" cy="158" rx="9" ry="6" fill="#1a1a1a"/>
        <ellipse cx="147" cy="156" rx="2.5" ry="1.5" fill="#444" opacity="0.5"/>
        <!-- 嘴巴 -->
        <path class="panda-mouth" d="M128 168 Q150 188 172 168" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <!-- 舌头 -->
        <ellipse class="panda-tongue" cx="150" cy="182" rx="9" ry="7" fill="#e8505b"/>
        <!-- 头顶墨镜（推到头顶） -->
        <rect x="70" y="38" width="70" height="28" rx="6" fill="#1a1a1a" opacity="0.9" transform="rotate(-8 105 52)"/>
        <rect x="160" y="38" width="70" height="28" rx="6" fill="#1a1a1a" opacity="0.9" transform="rotate(8 195 52)"/>
        <rect x="140" y="44" width="20" height="6" rx="2" fill="#333" transform="rotate(0 150 47)"/>
      </svg>
      <!-- 钥匙 -->
      <div class="key-container" id="key-container">
        <svg viewBox="0 0 80 120" id="key-svg">
          <defs>
            <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffd700"/>
              <stop offset="50%" stop-color="#ffed4a"/>
              <stop offset="100%" stop-color="#daa520"/>
            </linearGradient>
          </defs>
          <!-- 钥匙环（爱心形） -->
          <path d="M40 25 C40 15, 25 10, 25 22 C25 32, 40 42, 40 42 C40 42, 55 32, 55 22 C55 10, 40 15, 40 25 Z"

/* ===== 流星雨背景 ===== */
(function initMeteor() {
  const canvas = document.getElementById('meteor-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [], meteors = [];
  function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 150; i++) stars.push({ x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.5+0.3, a:Math.random()*0.6+0.2, p:Math.random()*6.28, s:Math.random()*0.02+0.005 });
  function spawnMeteor() {
    const startX = Math.random()*w*0.8 + w*0.1;
    meteors.push({ x:startX, y:-20, len:Math.random()*80+60, speed:Math.random()*6+8, angle:Math.PI/4+Math.random()*0.3, alpha:1, size:Math.random()*2+1 });
  }
  setInterval(spawnMeteor, 1200);
  function animate() {
    ctx.clearRect(0,0,w,h);
    for (const s of stars) {
      s.p += s.s;
      const alpha = s.a*(0.5+0.5*Math.sin(s.p));
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28);
      ctx.fillStyle = 'rgba(255,245,245,'+alpha+')'; ctx.fill();
    }
    for (let i = meteors.length-1; i>=0; i--) {
      const m = meteors[i];
      m.x += Math.cos(m.angle)*m.speed;
      m.y += Math.sin(m.angle)*m.speed;
      m.alpha -= 0.008;
      if (m.alpha <= 0 || m.y > h+50) { meteors.splice(i,1); continue; }
      const tailX = m.x - Math.cos(m.angle)*m.len;
      const tailY = m.y - Math.sin(m.angle)*m.len;
      const grad = ctx.createLinearGradient(m.x,m.y,tailX,tailY);
      grad.addColorStop(0,'rgba(255,228,160,'+m.alpha+')');
      grad.addColorStop(0.3,'rgba(255,107,157,'+m.alpha*0.6+')');
      grad.addColorStop(1,'rgba(255,255,255,0)');
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tailX,tailY);
      ctx.strokeStyle = grad; ctx.lineWidth = m.size; ctx.lineCap = 'round'; ctx.stroke();
      ctx.beginPath(); ctx.arc(m.x,m.y,m.size*1.5,0,6.28);
      ctx.fillStyle = 'rgba(255,240,200,'+m.alpha+')'; ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ===== 撒花粒子 ===== */
const confetti = (function() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [], w, h, running = false, animId = null;
  function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  const colors = ['#ff6b9d','#ff8fab','#ffc2d4','#ffe4a0','#fff3d6','#ff4d8d','#ffa0c0'];
  function createP(x,y,burst) {
    return { x:x!==undefined?x:Math.random()*w, y:y!==undefined?y:-20,
      vx:burst?(Math.random()-0.5)*12:(Math.random()-0.5)*2, vy:burst?-Math.random()*15-5:Math.random()*2+1,
      size:Math.random()*14+8, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*6.28, rs:(Math.random()-0.5)*0.1, heart:Math.random()>0.4,
      life:1, decay:burst?0.003:0.001, g:burst?0.25:0.05, wob:Math.random()*6.28, ws:Math.random()*0.05+0.02 };
  }
  function drawHeart(x,y,s,c,r) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(r); ctx.scale(s/30,s/30);
    ctx.beginPath(); ctx.moveTo(0,8); ctx.bezierCurveTo(-14,-4,-14,-18,0,-8);
    ctx.bezierCurveTo(14,-18,14,-4,0,8); ctx.fillStyle=c; ctx.fill(); ctx.restore();
  }
  function update() {
    ctx.clearRect(0,0,w,h);
    for (let i=particles.length-1;i>=0;i--) {
      const p=particles[i]; p.wob+=p.ws; p.x+=p.vx+Math.sin(p.wob)*0.8; p.y+=p.vy; p.vy+=p.g; p.rot+=p.rs; p.life-=p.decay;
      if (p.life<=0||p.y>h+50){particles.splice(i,1);continue;}
      ctx.globalAlpha=Math.min(1,p.life*2);
      if(p.heart)drawHeart(p.x,p.y,p.size,p.color,p.rot);
      else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*0.5,0,0,6.28);ctx.fillStyle=p.color;ctx.globalAlpha*=0.85;ctx.fill();ctx.restore();}
    }
    ctx.globalAlpha=1;
    if(running||particles.length>0)animId=requestAnimationFrame(update); else canvas.style.display='none';
  }
  return {
    start:function(){if(running)return;running=true;canvas.style.display='block';
      const sp=setInterval(function(){if(!running){clearInterval(sp);return;}for(let i=0;i<3;i++)particles.push(createP());},100);update();},
    burst:function(){canvas.style.display='block';for(let i=0;i<80;i++)particles.push(createP(w/2,h/2,true));if(!animId)update();},
    stop:function(){running=false;}
  };
})();
function startConfetti(){ state.confettiActive=true; confetti.start(); setTimeout(function(){confetti.burst();},300); }
function stopConfetti(){ state.confettiActive=false; confetti.stop(); }

function typeText(el, text, speed, callback) {
  el.innerHTML = '';
  let i = 0;
  function next() {
    if (i >= text.length) { if(callback) callback(); return; }
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    span.style.animationDelay = (i * 0.03) + 's';
    el.appendChild(span);
    i++;
    setTimeout(next, speed);
  }
  next();
}

function setPandaState(cls) {

}

/* ===== 选择题逻辑 ===== */
function initQuiz() {
  state.quizIndex = 0;
  state.quizQ1Attempts = 0;
  showQuestion();
}

function showQuestion() {
  const q = CONFIG.quizQuestions[state.quizIndex];
  document.getElementById('quiz-progress').textContent = '第 ' + (state.quizIndex + 1) + ' / 4 题';
  document.getElementById('quiz-question').textContent = q.question;
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-feedback').className = 'quiz-feedback';
  document.getElementById('quiz-celebration').classList.remove('show');

  const optsEl = document.getElementById('quiz-options');
  optsEl.innerHTML = '';
  q.options.forEach(function(opt, idx) {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.innerHTML = '<span class="opt-label">' + String.fromCharCode(65 + idx) + '.</span> ' + opt;
    btn.addEventListener('click', function() { answerQuestion(idx, btn); });
    optsEl.appendChild(btn);
  });
}

function answerQuestion(idx, btnEl) {
  const q = CONFIG.quizQuestions[state.quizIndex];
  const feedback = document.getElementById('quiz-feedback');
  const allBtns = document.querySelectorAll('.quiz-option');

  if (idx === q.correct) {
    // 答对
    btnEl.classList.add('correct');
    allBtns.forEach(function(b) { b.style.pointerEvents = 'none'; });
    feedback.textContent = q.congrats;
    feedback.className = 'quiz-feedback success';
    document.getElementById('quiz-celebration').classList.add('show');
    confetti.burst();

    // 最后一题答对后播放语音并进入回忆
    if (state.quizIndex === CONFIG.quizQuestions.length - 1) {
      setTimeout(function() {
        const voice = document.getElementById('voice-audio');
        voice.play().catch(function(){});
        setTimeout(function() { navigate('memories'); }, 5000);
      }, 2500);
    } else {
      setTimeout(function() {
        state.quizIndex++;
        showQuestion();
      }, 3000);
    }
  } else {
    // 答错
    btnEl.classList.add('wrong');
    if (q.secondChance && state.quizIndex === 0) {
      state.quizQ1Attempts++;
      if (state.quizQ1Attempts < 2) {
        feedback.textContent = q.errorMsg;
        feedback.className = 'quiz-feedback error';
        setTimeout(function() {
          btnEl.classList.remove('wrong');
          btnEl.style.pointerEvents = 'none';
          btnEl.style.opacity = '0.4';
        }, 800);
        return;
      }
    }
    feedback.textContent = q.errorMsg;
    feedback.className = 'quiz-feedback error';
    setTimeout(function() {
      btnEl.classList.remove('wrong');
      btnEl.style.pointerEvents = 'none';
      btnEl.style.opacity = '0.4';
    }, 800);
  }
}

/* ===== 回忆展示 ===== */
function renderMemories() {
  const stage = document.getElementById('memory-stage');
  const dots = document.getElementById('memory-dots');
  stage.innerHTML = ''; dots.innerHTML = '';
  MEMORIES.forEach(function(mem, idx) {
    const slide = document.createElement('div');
    slide.className = 'memory-slide' + (idx===0?' active':'');
    if (mem.src) {
      if (mem.type==='image') { const img=document.createElement('img'); img.src=mem.src; img.alt=mem.title; slide.appendChild(img); }
      else { const v=document.createElement('video'); v.src=mem.src; v.loop=true; v.muted=true; v.playsInline=true; v.autoplay=true; slide.appendChild(v); }
    } else {
      const ph=document.createElement('div'); ph.className='memory-placeholder '+(mem.phClass||'ph-1');
      const iconSvg = mem.type==='video'
        ? '<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
      ph.innerHTML = '<div class="memory-placeholder-icon">'+iconSvg+'</div><div class="memory-placeholder-text">'+mem.title+'</div><div class="memory-placeholder-hint">（此处将插入'+(mem.type==='video'?'视频':'照片')+'）</div>';
      slide.appendChild(ph);
    }
    const cap=document.createElement('div'); cap.className='memory-caption';
    cap.innerHTML='<span class="memory-caption-date">'+mem.date+'</span><div class="memory-caption-title">'+mem.title+'</div><div class="memory-caption-desc">'+mem.desc+'</div>';
    slide.appendChild(cap);
    stage.appendChild(slide);
    const dot=document.createElement('div'); dot.className='memory-dot'+(idx===0?' active':'');
    dot.addEventListener('click',function(){goToMemory(idx);}); dots.appendChild(dot);
  });
  updateMemoryUI();
}
function goToMemory(idx) {
  if(idx<0||idx>=MEMORIES.length)return;
  state.memoryIndex=idx;
  document.querySelectorAll('.memory-slide').forEach(function(s,i){
    s.classList.toggle('active',i===idx);
    const v=s.querySelector('video'); if(v){if(i===idx)v.play().catch(function(){});else v.pause();}
  });
  document.querySelectorAll('.memory-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
  updateMemoryUI(); resetAutoPlay();
}
function updateMemoryUI() {
  document.getElementById('memory-progress').textContent=(state.memoryIndex+1)+' / '+MEMORIES.length;
  document.getElementById('memory-prev').disabled=state.memoryIndex===0;
  document.getElementById('memory-next').disabled=state.memoryIndex===MEMORIES.length-1;
}
document.getElementById('memory-prev').addEventListener('click',function(){goToMemory(state.memoryIndex-1);});
document.getElementById('memory-next').addEventListener('click',function(){goToMemory(state.memoryIndex+1);});
document.getElementById('memory-finish').addEventListener('click',function(){navigate('ending');});
function startAutoPlay(){if(CONFIG.autoPlayInterval>0)resetAutoPlay();}
function resetAutoPlay(){
  if(state.autoPlayTimer)clearInterval(state.autoPlayTimer);
  if(CONFIG.autoPlayInterval>0){
    state.autoPlayTimer=setInterval(function(){
      const next=state.memoryIndex+1;
      if(next>=MEMORIES.length)stopAutoPlay(); else goToMemory(next);
    },CONFIG.autoPlayInterval);
  }
}
function stopAutoPlay(){if(state.autoPlayTimer){clearInterval(state.autoPlayTimer);state.autoPlayTimer=null;}}

/* ===== 结束页选择 ===== */
document.querySelectorAll('.choice-btn').forEach(function(btn){
  btn.addEventListener('click',function(){navigate('final');});
});

/* ===== 音乐控制 ===== */
const bgMusic=document.getElementById('bg-music');
const musicToggle=document.getElementById('music-toggle');
function playMusic(){
  if(CONFIG.musicSrc){
    bgMusic.src=CONFIG.musicSrc;
    bgMusic.play().then(function(){state.musicPlaying=true;musicToggle.classList.add('visible');}).catch(function(){musicToggle.classList.add('visible');});
  } else { musicToggle.classList.add('visible'); }
}
musicToggle.addEventListener('click',function(){
  if(!CONFIG.musicSrc){alert('背景音乐尚未配置，请在代码 CONFIG.musicSrc 中填入音频文件路径');return;}
  if(state.musicPlaying){bgMusic.pause();state.musicPlaying=false;}else{bgMusic.play().catch(function(){});state.musicPlaying=true;}
});

/* ===== 键盘导航 ===== */
document.addEventListener('keydown',function(e){
  if(state.currentRoute==='memories'){
    if(e.key==='ArrowLeft')goToMemory(state.memoryIndex-1);
    if(e.key==='ArrowRight')goToMemory(state.memoryIndex+1);
  }
});

/* ===== 初始化 ===== */
navigate('panda');
</script>
</body>
</html>
