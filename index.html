<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>给 Lily 的生日礼物</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg-deep:#06061a;--bg-mid:#0e0e2e;--rose:#ff6b9d;--rose-light:#ff8fab;--rose-pale:#ffc2d4;
  --gold:#ffd700;--gold-soft:#ffe4a0;--text-warm:#fff5f5;--text-dim:rgba(255,245,245,0.65);--text-faint:rgba(255,245,245,0.4);
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-deep);color:var(--text-warm);font-family:var(--sans);-webkit-font-smoothing:antialiased}

/* ===== 星空背景 ===== */
#galaxy-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;pointer-events:none;display:none}

/* ===== 音乐控制 ===== */
#music-toggle{position:fixed;top:20px;right:20px;z-index:200;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,194,212,0.3);background:rgba(14,14,46,0.6);backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;opacity:0;pointer-events:none}
#music-toggle.visible{opacity:1;pointer-events:auto}
#music-toggle:hover{border-color:var(--rose-light);background:rgba(255,107,157,0.15);transform:scale(1.08)}
#music-toggle svg{width:20px;height:20px;fill:var(--rose-pale)}

/* ===== 视图容器 ===== */
.view{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;opacity:0;visibility:hidden;transition:opacity .8s ease,visibility .8s ease}
.view.active{opacity:1;visibility:visible}

/* ===== 角色3D场景 ===== */
.char-scene{position:relative;width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;perspective:1600px}
.stage-3d{position:relative;width:340px;height:460px;transform-style:preserve-3d;margin-bottom:6px}
/* 虚拟屏幕框架 */
.screen-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateZ(-160px);width:300px;height:380px;border:2px solid rgba(180,200,255,0.2);border-radius:16px;background:rgba(14,14,46,0.2);backdrop-filter:blur(2px);box-shadow:0 0 100px rgba(100,150,255,0.1),inset 0 0 60px rgba(150,180,255,0.06)}
.screen-frame::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:80px;height:5px;background:rgba(180,200,255,0.2);border-radius:3px}
.screen-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:260px;height:340px;border-radius:50%;background:radial-gradient(ellipse,rgba(150,180,255,0.15) 0%,transparent 70%);animation:screenGlow 3s ease-in-out infinite;pointer-events:none}
@keyframes screenGlow{0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}

/* 角色图片 */
.char-img-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateZ(0px);width:260px;height:420px;transition:transform 1.5s cubic-bezier(0.34,1.56,0.64,1);transform-style:preserve-3d}
.char-img-wrap.jumped{transform:translate(-50%,-50%) translateZ(220px) scale(1.18)}
.char-img-wrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 30px 60px rgba(0,0,0,0.6)) drop-shadow(0 0 50px rgba(180,150,255,0.2))}
/* 悬浮动画 */
.char-img-wrap.idle-float{animation:charFloat 4s ease-in-out infinite}
.char-img-wrap.jumped.idle-float{animation:charFloatJump 4s ease-in-out infinite}
@keyframes charFloat{0%,100%{transform:translate(-50%,-50%) translateY(0) rotateY(0deg)}50%{transform:translate(-50%,-50%) translateY(-14px) rotateY(2deg)}}
@keyframes charFloatJump{0%,100%{transform:translate(-50%,-50%) translateZ(220px) scale(1.18) translateY(0) rotateY(0deg)}50%{transform:translate(-50%,-50%) translateZ(220px) scale(1.18) translateY(-18px) rotateY(3deg)}}
/* 角色光晕 */
.char-aura{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:360px;height:460px;border-radius:50%;background:radial-gradient(ellipse,rgba(200,170,255,0.12) 0%,rgba(255,150,200,0.06) 40%,transparent 70%);animation:auraPulse 3.5s ease-in-out infinite;pointer-events:none}
@keyframes auraPulse{0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}

/* 钥匙 */
.key-wrap{position:absolute;right:0px;bottom:22%;width:60px;height:90px;opacity:0;transform:scale(0) rotate(-20deg);transition:all .6s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer;z-index:10}
.key-wrap.show{opacity:1;transform:scale(1) rotate(0deg);animation:keyShine 1.5s ease-in-out infinite}
@keyframes keyShine{0%,100%{filter:drop-shadow(0 0 10px rgba(255,215,0,0.6))}50%{filter:drop-shadow(0 0 28px rgba(255,215,0,0.95))}}
.key-wrap svg{width:100%;height:100%}
.key-hint{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--gold-soft);white-space:nowrap;letter-spacing:1px;animation:hintBlink 1.5s ease-in-out infinite}
@keyframes hintBlink{0%,100%{opacity:0.4}50%{opacity:1}}

/* ===== 对话框 ===== */
.dialog-box{position:relative;max-width:380px;width:100%;background:rgba(14,14,46,0.92);border:1px solid rgba(200,180,255,0.3);border-radius:20px;padding:20px 24px;backdrop-filter:blur(14px);margin-top:4px;box-shadow:0 8px 50px rgba(150,100,255,0.2);opacity:0;transform:translateY(20px);transition:all .5s ease}
.dialog-box.show{opacity:1;transform:translateY(0)}
.dialog-box::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:rgba(14,14,46,0.92);border-left:1px solid rgba(200,180,255,0.3);border-top:1px solid rgba(200,180,255,0.3)}
.dialog-text{font-family:var(--serif);font-size:15px;line-height:2;color:var(--text-warm);letter-spacing:1px;min-height:45px}
.dialog-text .char{opacity:0;display:inline-block;animation:charFade .3s ease forwards}
@keyframes charFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.dialog-options{display:flex;gap:14px;justify-content:center;margin-top:16px;opacity:0;transition:opacity .5s}
.dialog-options.show{opacity:1}
.option-btn{padding:12px 36px;border-radius:50px;font-size:15px;font-family:var(--serif);font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .3s;border:2px solid}
.option-btn.yes{background:linear-gradient(135deg,var(--rose),var(--rose-light));border-color:var(--rose);color:#fff;box-shadow:0 4px 20px rgba(255,107,157,0.4)}
.option-btn.yes:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 8px 30px rgba(255,107,157,0.6)}
.option-btn.no{background:transparent;border-color:rgba(255,194,212,0.4);color:var(--text-dim)}
.option-btn.no:hover{border-color:var(--rose-pale);color:var(--rose-pale);transform:scale(1.05)}
.opening-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--text-faint);letter-spacing:2px;animation:hintBlink 2s ease-in-out infinite}

/* ===== 选择题 ===== */
.quiz-container{width:100%;max-width:460px;text-align:center}
.quiz-progress{font-size:12px;color:var(--rose-pale);letter-spacing:2px;margin-bottom:12px;opacity:0.8}
.quiz-question{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--text-warm);line-height:1.8;margin-bottom:24px;letter-spacing:1px;min-height:65px}
.quiz-options{display:flex;flex-direction:column;gap:11px}
.quiz-option{padding:14px 20px;border:1px solid rgba(255,194,212,0.25);border-radius:14px;background:rgba(14,14,46,0.6);color:var(--text-warm);font-size:14px;font-family:var(--serif);font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .3s;text-align:left;position:relative;overflow:hidden}
.quiz-option:hover{border-color:var(--rose);background:rgba(255,107,157,0.12);transform:translateX(6px)}
.quiz-option.correct{border-color:#4ade80;background:rgba(74,222,128,0.15);color:#86efac}
.quiz-option.wrong{border-color:#f87171;background:rgba(248,113,113,0.15);color:#fca5a5;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.quiz-option .opt-label{display:inline-block;width:24px;color:var(--rose);font-weight:700}
.quiz-feedback{margin-top:18px;font-size:13px;min-height:20px;font-family:var(--serif);letter-spacing:1px;transition:all .3s}
.quiz-feedback.success{color:#86efac}
.quiz-feedback.error{color:#fca5a5}
.quiz-mini-char{margin:0 auto 14px;width:80px;height:130px;opacity:0;transform:scale(0);transition:all .5s}
.quiz-mini-char.show{opacity:1;transform:scale(1)}
.quiz-mini-char img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 20px rgba(0,0,0,0.4))}

/* ===== 回忆展示 ===== */
.memories-wrapper{width:100%;max-width:880px;height:100%;display:flex;flex-direction:column;justify-content:center;position:relative}
.memory-stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 80px rgba(255,107,157,0.1);background:var(--bg-mid)}
.memory-slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity 1s ease;display:flex;align-items:center;justify-content:center}
.memory-slide.active{opacity:1}
.memory-slide img,.memory-slide video{width:100%;height:100%;object-fit:cover}
.memory-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px}
.memory-placeholder-icon{width:48px;height:48px;opacity:0.5}
.memory-placeholder-icon svg{width:100%;height:100%;stroke:var(--rose-pale);fill:none;stroke-width:1.2}
.memory-placeholder-text{font-family:var(--serif);font-size:17px;color:var(--text-dim);letter-spacing:2px}
.memory-placeholder-hint{font-size:11px;color:var(--text-faint);letter-spacing:1px}
.ph-1{background:linear-gradient(135deg,#1a0a2e,#2d1b4e,#1a0a2e)}.ph-2{background:linear-gradient(135deg,#2e0a1a,#4e1b2d,#2e0a1a)}
.ph-3{background:linear-gradient(135deg,#0a1a2e,#1b2d4e,#0a1a2e)}.ph-4{background:linear-gradient(135deg,#2e2a0a,#4e451b,#2e2a0a)}
.ph-5{background:linear-gradient(135deg,#1a2e0a,#2d4e1b,#1a2e0a)}.ph-6{background:linear-gradient(135deg,#2e0a2e,#4e1b4e,#2e0a2e)}
.memory-caption{position:absolute;bottom:0;left:0;right:0;padding:32px 24px 20px;background:linear-gradient(transparent,rgba(6,6,26,0.92));z-index:5}
.memory-caption-title{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--text-warm);margin-bottom:4px;letter-spacing:1px}
.memory-caption-desc{font-size:12px;color:var(--text-dim);line-height:1.7}
.memory-caption-date{position:absolute;top:16px;right:20px;font-size:10px;color:var(--rose-pale);letter-spacing:2px;opacity:0.8}
.memory-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:0 6px}
.memory-arrow{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,194,212,0.25);background:rgba(14,14,46,0.6);color:var(--rose-pale);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
.memory-arrow:hover{border-color:var(--rose);background:rgba(255,107,157,0.15);transform:scale(1.1)}
.memory-arrow:disabled{opacity:0.3;cursor:not-allowed;transform:none}
.memory-dots{display:flex;gap:7px;align-items:center}
.memory-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,194,212,0.25);cursor:pointer;transition:all .3s}
.memory-dot.active{background:var(--rose);width:20px;border-radius:4px;box-shadow:0 0 12px rgba(255,107,157,0.5)}
.memory-progress-text{font-size:11px;color:var(--text-dim);letter-spacing:1px;min-width:42px;text-align:center}
.memory-finish-btn{margin-top:16px;padding:10px 28px;border:1px solid rgba(255,194,212,0.3);border-radius:50px;background:transparent;color:var(--text-dim);font-size:11px;font-family:var(--sans);letter-spacing:3px;cursor:pointer;transition:all .3s;align-self:center}
.memory-finish-btn:hover{border-color:var(--rose-light);color:var(--rose-pale);background:rgba(255,107,157,0.1)}

/* ===== 结束告白 ===== */
.ending-content{text-align:center;max-width:660px;width:100%}
.ending-message{font-family:var(--serif);font-size:18px;font-weight:600;line-height:2.3;color:var(--text-warm);letter-spacing:1.5px;margin-bottom:40px;text-shadow:0 0 40px rgba(255,107,157,0.25)}
.ending-message .highlight{color:var(--rose-light);font-weight:700}
.ending-message .gold-text{color:var(--gold)}
.ending-choices{display:flex;flex-direction:column;gap:13px;max-width:340px;margin:0 auto}
.choice-btn{padding:15px 24px;border:1px solid rgba(255,194,212,0.3);border-radius:14px;background:rgba(14,14,46,0.5);color:var(--text-warm);font-size:14px;font-family:var(--serif);font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .35s;text-align:left;position:relative;overflow:hidden}
.choice-btn:hover{border-color:var(--rose);background:rgba(255,107,157,0.12);transform:translateX(6px);box-shadow:0 4px 24px rgba(255,107,157,0.2)}
.choice-btn .choice-label{display:inline-block;width:24px;color:var(--rose);font-weight:700}

/* ===== 最终页 ===== */
.final-content{text-align:center;max-width:580px;width:100%}
.final-title{font-family:var(--serif);font-size:28px;font-weight:900;color:var(--text-warm);letter-spacing:3px;margin-bottom:16px;line-height:1.6;text-shadow:0 0 50px rgba(255,107,157,0.4);animation:finalGlow 3s ease-in-out infinite}
@keyframes finalGlow{0%,100%{text-shadow:0 0 30px rgba(255,107,157,0.3)}50%{text-shadow:0 0 60px rgba(255,107,157,0.6),0 0 100px rgba(255,215,0,0.2)}}
.final-subtitle{font-size:13px;color:var(--text-dim);letter-spacing:2px;line-height:2;margin-bottom:32px}
.final-heart{width:85px;height:85px;margin:0 auto 24px;animation:heartBeat 1.2s ease-in-out infinite}
.final-heart svg{width:100%;height:100%;filter:drop-shadow(0 0 30px rgba(255,107,157,0.6))}
@keyframes heartBeat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}60%{transform:scale(1)}}
.final-signature{font-family:var(--serif);font-size:12px;color:var(--rose-pale);letter-spacing:4px;margin-top:18px;opacity:0.8}

/* ===== 响应式 ===== */
@media (max-width:768px){
  .stage-3d{width:280px;height:400px}
  .char-img-wrap{width:220px;height:360px}
  .screen-frame{width:250px;height:320px}
  .dialog-box{max-width:340px;padding:18px 20px}
  .dialog-text{font-size:14px}
  .quiz-question{font-size:17px}
  .quiz-option{font-size:13px;padding:12px 16px}
  .ending-message{font-size:15px;line-height:2.1}
  .final-title{font-size:22px}
  .memory-stage{aspect-ratio:4/3}
  .memory-caption{padding:26px 16px 16px}
  .memory-caption-title{font-size:15px}
  .choice-btn{font-size:13px;padding:13px 18px}
  .view{padding:20px 14px}
}
@media (max-width:480px){
  .stage-3d{width:240px;height:360px}
  .char-img-wrap{width:190px;height:320px}
  .dialog-text{font-size:13px;line-height:1.9}
  .quiz-question{font-size:15px}
  .ending-message{font-size:13px;line-height:2}
  .final-title{font-size:19px}
  .option-btn{padding:10px 28px;font-size:13px}
  .key-wrap{width:50px;height:75px}
}
</style>
</head>
<body>

<canvas id="galaxy-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<audio id="bg-music" loop preload="auto"><source src="" type="audio/mpeg"></audio>
<audio id="voice-audio" preload="auto"><source src="https://aka.doubaocdn.com/s/CEtbwhNdjq" type="audio/mpeg"></audio>

<button id="music-toggle" title="背景音乐" aria-label="背景音乐">
  <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
</button>

<!-- ===== 视图1：角色3D场景 ===== -->
<section class="view active" data-route="panda" id="view-panda">
  <div class="char-scene">
    <div class="stage-3d">
      <div class="char-aura"></div>
      <div class="screen-glow"></div>
      <div class="screen-frame"></div>
      <div class="char-img-wrap idle-float" id="char-wrap">
        <img src="./anime_girl.png" alt="星空少女" id="char-img">
      </div>
      <div class="key-wrap" id="key-wrap">
        <svg viewBox="0 0 80 120">
          <defs><linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd700"/><stop offset="50%" stop-color="#ffed4a"/><stop offset="100%" stop-color="#daa520"/>
          </linearGradient></defs>
          <path d="M40 22 C40 12, 24 8, 24 20 C24 30, 40 40, 40 40 C40 40, 56 30, 56 20 C56 8, 40 12, 40 22 Z" fill="url(#keyGrad)" stroke="#b8860b" stroke-width="1.5"/>
          <rect x="35" y="40" width="10" height="55" rx="3" fill="url(#keyGrad)" stroke="#b8860b" stroke-width="1"/>
          <rect x="45" y="72" width="14" height="8" rx="2" fill="url(#keyGrad)" stroke="#b8860b" stroke-width="1"/>
          <rect x="45" y="85" width="10" height="7" rx="2" fill="url(#keyGrad)" stroke="#b8860b" stroke-width="1"/>
          <circle cx="40" cy="25" r="3" fill="#fff" opacity="0.7"/>
        </svg>
        <div class="key-hint">点击钥匙开启回忆</div>
      </div>
    </div>
    <div class="dialog-box" id="dialog-box"><div class="dialog-text" id="dialog-text"></div></div>
    <div class="dialog-options" id="dialog-options">
      <button class="option-btn yes" id="opt-yes">Yes</button>
      <button class="option-btn no" id="opt-no">No</button>
    </div>
    <div class="opening-hint" id="opening-hint">点击屏幕开始</div>
  </div>
</section>

<!-- ===== 视图2：选择题 ===== -->
<section class="view" data-route="quiz" id="view-quiz">
  <div class="quiz-container">
    <div class="quiz-mini-char" id="quiz-mini-char"><img src="./anime_girl.png" alt="少女"></div>
    <div class="quiz-progress" id="quiz-progress">第 1 / 4 题</div>
    <div class="quiz-question" id="quiz-question"></div>
    <div class="quiz-options" id="quiz-options"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
  </div>
</section>

<!-- ===== 视图3：回忆展示 ===== -->
<section class="view" data-route="memories" id="view-memories">
  <div class="memories-wrapper">
    <div class="memory-stage" id="memory-stage"></div>
    <div class="memory-nav">
      <button class="memory-arrow" id="memory-prev">&#10094;</button>
      <div class="memory-dots" id="memory-dots"></div>
      <span class="memory-progress-text" id="memory-progress">1 / 6</span>
      <button class="memory-arrow" id="memory-next">&#10095;</button>
    </div>
    <button class="memory-finish-btn" id="memory-finish">看 完 了 ， 继 续</button>
  </div>
</section>

<!-- ===== 视图4：结束告白 ===== -->
<section class="view" data-route="ending" id="view-ending">
  <div class="ending-content">
    <p class="ending-message">
      以后每年的<span class="gold-text">10月29日</span>，<span class="highlight">Young.T</span>都在你的身边陪伴着你，<br>
      无论是以肉体或是心灵传递的形式，一直守护着你！<br>
      让我们在一起的每一天都变得<span class="highlight">"热恋"</span>！
    </p>
    <div class="ending-choices">
      <button class="choice-btn" data-choice="A"><span class="choice-label">A.</span> Lily do</button>
      <button class="choice-btn" data-choice="B"><span class="choice-label">B.</span> Lily absolutely do</button>
      <button class="choice-btn" data-choice="C"><span class="choice-label">C.</span> Lily definitely do</button>
    </div>
  </div>
</section>

<!-- ===== 视图5：最终页 ===== -->
<section class="view" data-route="final" id="view-final">
  <div class="final-content">
    <div class="final-heart">
      <svg viewBox="0 0 64 64" fill="none">

/* ===== 真实银河星空 ===== */
(function initGalaxy(){
  const canvas=document.getElementById('galaxy-canvas');
  const ctx=canvas.getContext('2d');
  let w,h,stars=[],meteors=[],nebulae=[];
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;}
  resize();addEventListener('resize',resize);

  // 背景渐变（深蓝色夜空，不是纯黑）
  function drawBackground(){
    const grad=ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0,'#06061a');
    grad.addColorStop(0.3,'#0a0a2e');
    grad.addColorStop(0.6,'#0e0e38');
    grad.addColorStop(1,'#080820');
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,w,h);
  }

  // 银河星云（多层径向渐变，斜跨天空）
  nebulae=[
    {x:w*0.3,y:h*0.35,r:w*0.5,color1:'rgba(100,150,255,0.12)',color2:'rgba(150,100,255,0.06)',rot:-0.4},
    {x:w*0.6,y:h*0.5,r:w*0.45,color1:'rgba(200,180,255,0.1)',color2:'rgba(255,150,200,0.05)',rot:-0.3},
    {x:w*0.45,y:h*0.6,r:w*0.4,color1:'rgba(180,220,255,0.08)',color2:'rgba(100,180,255,0.04)',rot:-0.35},
    {x:w*0.7,y:h*0.25,r:w*0.3,color1:'rgba(255,200,220,0.06)',color2:'rgba(200,150,255,0.03)',rot:-0.3}
  ];
  function drawNebulae(){
    for(const n of nebulae){
      ctx.save();
      ctx.translate(n.x,n.y);
      ctx.rotate(n.rot);
      const grad=ctx.createRadialGradient(0,0,0,0,0,n.r);
      grad.addColorStop(0,n.color1);
      grad.addColorStop(0.5,n.color2);
      grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grad;
      ctx.beginPath();
      ctx.ellipse(0,0,n.r,n.r*0.35,0,0,6.28);
      ctx.fill();
      ctx.restore();
    }
  }

  // 星星（2000+颗，多种颜色，大星带光晕）
  const starColors=['rgba(255,255,255,','rgba(200,220,255,','rgba(255,240,220,','rgba(255,200,220,','rgba(180,200,255,','rgba(255,230,200,'];
  const starCount=Math.min(2200,Math.floor(w*h/700));
  for(let i=0;i<starCount;i++){
    const isBig=Math.random()>0.92;
    stars.push({
      x:Math.random()*w,y:Math.random()*h,
      r:isBig?Math.random()*1.8+0.8:Math.random()*1.2+0.3,
      color:starColors[Math.floor(Math.random()*starColors.length)],
      a:Math.random()*0.6+0.3,
      twinkle:Math.random()*6.28,
      twinkleSpeed:Math.random()*0.025+0.008,
      big:isBig
    });
  }

  // 流星（多道并行，长尾迹，渐变色）
  function spawnMeteor(){
    const startX=Math.random()*w*0.8+w*0.1;
    meteors.push({
      x:startX,y:-40,
      vx:(Math.random()-0.3)*6+2,
      vy:Math.random()*5+6,
      len:Math.random()*180+120,
      alpha:1,
      size:Math.random()*2+1.5,
      hue:Math.random()>0.5?'blue':'pink'
    });
  }
  setInterval(spawnMeteor,250);
  setInterval(spawnMeteor,500);
  setInterval(spawnMeteor,800);

  function animate(){
    drawBackground();
    drawNebulae();
    // 星星
    for(const s of stars){
      s.twinkle+=s.twinkleSpeed;
      const alpha=s.a*(0.5+0.5*Math.sin(s.twinkle));
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);
      ctx.fillStyle=s.color+alpha+')';ctx.fill();
      if(s.big){
        // 大星带光晕
        ctx.beginPath();ctx.arc(s.x,s.y,s.r*4,0,6.28);
        ctx.fillStyle=s.color+(alpha*0.1)+')';ctx.fill();
        // 十字光芒
        ctx.strokeStyle=s.color+(alpha*0.15)+')';
        ctx.lineWidth=0.5;
        ctx.beginPath();ctx.moveTo(s.x-s.r*6,s.y);ctx.lineTo(s.x+s.r*6,s.y);
        ctx.moveTo(s.x,s.y-s.r*6);ctx.lineTo(s.x,s.y+s.r*6);ctx.stroke();
      }
    }
    // 流星
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      m.x+=m.vx;m.y+=m.vy;m.alpha-=0.006;
      if(m.alpha<=0||m.y>h+60){meteors.splice(i,1);continue;}
      const tailX=m.x-m.vx*(m.len/8);
      const tailY=m.y-m.vy*(m.len/8);
      const grad=ctx.createLinearGradient(m.x,m.y,tailX,tailY);
      if(m.hue==='blue'){
        grad.addColorStop(0,'rgba(255,255,255,'+m.alpha+')');
        grad.addColorStop(0.2,'rgba(180,220,255,'+(m.alpha*0.7)+')');
        grad.addColorStop(0.5,'rgba(100,150,255,'+(m.alpha*0.4)+')');
        grad.addColorStop(1,'rgba(150,100,255,0)');
      }else{
        grad.addColorStop(0,'rgba(255,255,255,'+m.alpha+')');
        grad.addColorStop(0.2,'rgba(255,200,220,'+(m.alpha*0.7)+')');
        grad.addColorStop(0.5,'rgba(255,107,157,'+(m.alpha*0.4)+')');
        grad.addColorStop(1,'rgba(200,100,255,0)');
      }
      ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(tailX,tailY);
      ctx.strokeStyle=grad;ctx.lineWidth=m.size;ctx.lineCap='round';ctx.stroke();
      // 流星头部光晕
      ctx.beginPath();ctx.arc(m.x,m.y,m.size*3,0,6.28);
      ctx.fillStyle='rgba(255,255,255,'+(m.alpha*0.3)+')';ctx.fill();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ===== 撒花粒子 ===== */
const confetti=(function(){
  const canvas=document.getElementById('confetti-canvas');const ctx=canvas.getContext('2d');
  let particles=[],w,h,running=false,animId=null;
  function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight;}
  resize();addEventListener('resize',resize);
  const colors=['#ff6b9d','#ff8fab','#ffc2d4','#ffe4a0','#fff3d6','#ff4d8d','#ffa0c0','#c4b5fd','#a5b4fc'];
  function createP(x,y,burst){return{x:x!==undefined?x:Math.random()*w,y:y!==undefined?y:-20,vx:burst?(Math.random()-0.5)*12:(Math.random()-0.5)*2,vy:burst?-Math.random()*15-5:Math.random()*2+1,size:Math.random()*14+8,color:colors[Math.floor(Math.random()*colors.length)],rot:Math.random()*6.28,rs:(Math.random()-0.5)*0.1,heart:Math.random()>0.4,life:1,decay:burst?0.003:0.001,g:burst?0.25:0.05,wob:Math.random()*6.28,ws:Math.random()*0.05+0.02};}
  function drawHeart(x,y,s,c,r){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(s/30,s/30);ctx.beginPath();ctx.moveTo(0,8);ctx.bezierCurveTo(-14,-4,-14,-18,0,-8);ctx.bezierCurveTo(14,-18,14,-4,0,8);ctx.fillStyle=c;ctx.fill();ctx.restore();}
  function update(){ctx.clearRect(0,0,w,h);
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.wob+=p.ws;p.x+=p.vx+Math.sin(p.wob)*0.8;p.y+=p.vy;p.vy+=p.g;p.rot+=p.rs;p.life-=p.decay;
      if(p.life<=0||p.y>h+50){particles.splice(i,1);continue;}
      ctx.globalAlpha=Math.min(1,p.life*2);
      if(p.heart)drawHeart(p.x,p.y,p.size,p.color,p.rot);
      else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*0.5,0,0,6.28);ctx.fillStyle=p.color;ctx.globalAlpha*=0.85;ctx.fill();ctx.restore();}}
    ctx.globalAlpha=1;
    if(running||particles.length>0)animId=requestAnimationFrame(update);else canvas.style.display='none';}
  return{start:function(){if(running)return;running=true;canvas.style.display='block';const sp=setInterval(function(){if(!running){clearInterval(sp);return;}for(let i=0;i<3;i++)particles.push(createP());},100);update();},
    burst:function(){canvas.style.display='block';for(let i=0;i<80;i++)particles.push(createP(w/2,h/2,true));if(!animId)update();},
    stop:function(){running=false;}};
})();
function startConfetti(){state.confettiActive=true;confetti.start();setTimeout(function(){confetti.burst();},300);}
function stopConfetti(){state.confettiActive=false;confetti.stop();}

/* ===== 角色场景逻辑 ===== */
const charWrap=document.getElementById('char-wrap');
const dialogBox=document.getElementById('dialog-box');
const dialogText=document.getElementById('dialog-text');
const dialogOptions=document.getElementById('dialog-options');
const openingHint=document.getElementById('opening-hint');
const keyWrap=document.getElementById('key-wrap');
const DIALOG1_TEXT='Lily 你能看到我在向你眨眼吗？';
const DIALOG2_TEXT='你的星空少女向你送来最真挚的生日祝福！——愿你一直能够成长在充满爱的环境里，勇敢的去cosplay你喜欢的角色，身体中的妖魔鬼怪永远绕开你，你将会变得像Young.T那般无所无惧、勇往直前、意志坚定！';

function typeText(el,text,speed,callback){
  el.innerHTML='';let i=0;
  function next(){if(i>=text.length){if(callback)callback();return;}
    const span=document.createElement('span');span.className='char';
    span.textContent=text[i]===' '?'\u00A0':text[i];span.style.animationDelay=(i*0.03)+'s';
    el.appendChild(span);i++;setTimeout(next,speed);}
  next();
}

document.getElementById('view-panda').addEventListener('click',function(e){
  if(state.pandaStage==='idle'&&!e.target.closest('#key-wrap')){startDialog1();}
});

function startDialog1(){
  state.pandaStage='dialog1';
  openingHint.style.display='none';
  // 角色从屏幕跳出
  charWrap.classList.remove('idle-float');
  charWrap.classList.add('jumped');
  setTimeout(function(){charWrap.classList.add('idle-float');},1600);
  setTimeout(function(){
    dialogBox.classList.add('show');
    typeText(dialogText,DIALOG1_TEXT,80,function(){
      setTimeout(function(){dialogOptions.classList.add('show');},800);
    });
  },1200);
}

document.getElementById('opt-yes').addEventListener('click',function(e){

document.getElementById('opt-no').addEventListener('click',function(e){

function startDialog2(){
  state.pandaStage='dialog2';
  typeText(dialogText,DIALOG2_TEXT,50,function(){
    setTimeout(function(){showKey();},1500);

document.getElementById('key-wrap').addEventListener('click',function(e){

/* ===== 选择题逻辑 ===== */
function initQuiz(){state.quizIndex=0;state.quizQ1Attempts=0;showQuestion();}
function showQuestion(){
  const q=CONFIG.quizQuestions[state.quizIndex];
  document.getElementById('quiz-progress').textContent='第 '+(state.quizIndex+1)+' / 4 题';
  document.getElementById('quiz-question').textContent=q.question;
  document.getElementById('quiz-feedback').textContent='';
  document.getElementById('quiz-feedback').className='quiz-feedback';
  document.getElementById('quiz-mini-char').classList.remove('show');
  const optsEl=document.getElementById('quiz-options');optsEl.innerHTML='';
  q.options.forEach(function(opt,idx){
    const btn=document.createElement('button');btn.className='quiz-option';
    btn.innerHTML='<span class="opt-label">'+String.fromCharCode(65+idx)+'.</span> '+opt;
    btn.addEventListener('click',function(){answerQuestion(idx,btn);});
    optsEl.appendChild(btn);
  });
}
function answerQuestion(idx,btnEl){
  const q=CONFIG.quizQuestions[state.quizIndex];
  const feedback=document.getElementById('quiz-feedback');
  const allBtns=document.querySelectorAll('.quiz-option');
  if(idx===q.correct){
    btnEl.classList.add('correct');allBtns.forEach(function(b){b.style.pointerEvents='none';});
    feedback.textContent=q.congrats;feedback.className='quiz-feedback success';
    document.getElementById('quiz-mini-char').classList.add('show');
    confetti.burst();
    if(state.quizIndex===CONFIG.quizQuestions.length-1){
      setTimeout(function(){const voice=document.getElementById('voice-audio');voice.play().catch(function(){});
        setTimeout(function(){navigate('memories');},5000);},2500);
    }else{setTimeout(function(){state.quizIndex++;showQuestion();},3000);}
  }else{
    btnEl.classList.add('wrong');
    if(q.secondChance&&state.quizIndex===0){
      state.quizQ1Attempts++;
      if(state.quizQ1Attempts<2){feedback.textContent=q.errorMsg;feedback.className='quiz-feedback error';
        setTimeout(function(){btnEl.classList.remove('wrong');btnEl.style.pointerEvents='none';btnEl.style.opacity='0.4';},800);return;}
    }
    feedback.textContent=q.errorMsg;feedback.className='quiz-feedback error';
    setTimeout(function(){btnEl.classList.remove('wrong');btnEl.style.pointerEvents='none';btnEl.style.opacity='0.4';},800);
  }
}

/* ===== 回忆展示 ===== */
function renderMemories(){
  const stage=document.getElementById('memory-stage');const dots=document.getElementById('memory-dots');
  stage.innerHTML='';dots.innerHTML='';
  MEMORIES.forEach(function(mem,idx){
    const slide=document.createElement('div');slide.className='memory-slide'+(idx===0?' active':'');
    if(mem.src){
      if(mem.type==='image'){const img=document.createElement('img');img.src=mem.src;img.alt=mem.title;slide.appendChild(img);}
      else{const v=document.createElement('video');v.src=mem.src;v.loop=true;v.muted=true;v.playsInline=true;v.autoplay=true;slide.appendChild(v);}
    }else{
      const ph=document.createElement('div');ph.className='memory-placeholder '+(mem.phClass||'ph-1');
      const iconSvg=mem.type==='video'?'<svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>':'<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
      ph.innerHTML='<div class="memory-placeholder-icon">'+iconSvg+'</div><div class="memory-placeholder-text">'+mem.title+'</div><div class="memory-placeholder-hint">（此处将插入'+(mem.type==='video'?'视频':'照片')+'）</div>';
      slide.appendChild(ph);
    }
    const cap=document.createElement('div');cap.className='memory-caption';
    cap.innerHTML='<span class="memory-caption-date">'+mem.date+'</span><div class="memory-caption-title">'+mem.title+'</div><div class="memory-caption-desc">'+mem.desc+'</div>';
    slide.appendChild(cap);stage.appendChild(slide);
    const dot=document.createElement('div');dot.className='memory-dot'+(idx===0?' active':'');
    dot.addEventListener('click',function(){goToMemory(idx);});dots.appendChild(dot);
  });updateMemoryUI();
}
function goToMemory(idx){
  if(idx<0||idx>=MEMORIES.length)return;state.memoryIndex=idx;
  document.querySelectorAll('.memory-slide').forEach(function(s,i){s.classList.toggle('active',i===idx);
    const v=s.querySelector('video');if(v){if(i===idx)v.play().catch(function(){});else v.pause();}});
  document.querySelectorAll('.memory-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
  updateMemoryUI();resetAutoPlay();
}
function updateMemoryUI(){
  document.getElementById('memory-progress').textContent=(state.memoryIndex+1)+' / '+MEMORIES.length;
  document.getElementById('memory-prev').disabled=state.memoryIndex===0;
  document.getElementById('memory-next').disabled=state.memoryIndex===MEMORIES.length-1;
}
document.getElementById('memory-prev').addEventListener('click',function(){goToMemory(state.memoryIndex-1);});
document.getElementById('memory-next').addEventListener('click',function(){goToMemory(state.memoryIndex+1);});
document.getElementById('memory-finish').addEventListener('click',function(){navigate('ending');});
function startAutoPlay(){if(CONFIG.autoPlayInterval>0)resetAutoPlay();}
function resetAutoPlay(){
  if(state.autoPlayTimer)clearInterval(state.autoPlayTimer);
  if(CONFIG.autoPlayInterval>0){state.autoPlayTimer=setInterval(function(){
    const next=state.memoryIndex+1;if(next>=MEMORIES.length)stopAutoPlay();else goToMemory(next);
  },CONFIG.autoPlayInterval);}
}
function stopAutoPlay(){if(state.autoPlayTimer){clearInterval(state.autoPlayTimer);state.autoPlayTimer=null;}}

/* ===== 结束页选择 ===== */
document.querySelectorAll('.choice-btn').forEach(function(btn){btn.addEventListener('click',function(){navigate('final');});});

/* ===== 音乐控制 ===== */
const bgMusic=document.getElementById('bg-music');const musicToggle=document.getElementById('music-toggle');
function playMusic(){
  if(CONFIG.musicSrc){bgMusic.src=CONFIG.musicSrc;
    bgMusic.play().then(function(){state.musicPlaying=true;musicToggle.classList.add('visible');}).catch(function(){musicToggle.classList.add('visible');});
  }else{musicToggle.classList.add('visible');}
}
musicToggle.addEventListener('click',function(){
  if(!CONFIG.musicSrc){alert('背景音乐尚未配置，请在代码 CONFIG.musicSrc 中填入音频文件路径');return;}
  if(state.musicPlaying){bgMusic.pause();state.musicPlaying=false;}else{bgMusic.play().catch(function(){});state.musicPlaying=true;}
});

/* ===== 键盘导航 ===== */
document.addEventListener('keydown',function(e){
  if(state.currentRoute==='memories'){
    if(e.key==='ArrowLeft')goToMemory(state.memoryIndex-1);
    if(e.key==='ArrowRight')goToMemory(state.memoryIndex+1);
  }
});

navigate('panda');
</script>
