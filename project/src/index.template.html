<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#25151f">
<meta name="description" content="给Lily的21岁生日邀请。10月29日，你要爱久。一个为你准备的童话世界，一封想慢慢说给你听的信。">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>给 Lily 的生日雪夜 · 2026.10.29</title>
<style>
/*__STYLES__*/
</style>
</head>
<body>
<div id="app" inert>
  <canvas id="scene" aria-label="雪夜松林中的木屋 3D 场景"></canvas>

  <header class="brand">
    <div class="brand-mark" aria-hidden="true">
      <span></span>
      <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 2v20M4.2 6.5l15.6 11M19.8 6.5L4.2 17.5M8 4l4 2 4-2M8 20l4-2 4 2" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      <span></span>
    </div>
    <p class="eyebrow">A WINTER HIDEAWAY</p>
    <h1>寒冬林居</h1>
    <p class="subtitle">松林深处，有一盏为你留着的灯。</p>
  </header>

  <aside class="weather">
    <div class="weather-temp"><span id="degrees">−12°</span><span class="flakes" aria-hidden="true">❄</span></div>
    <div class="weather-meta">
      <span>松林雪夜</span>
      <span class="dot"></span>
      <span>微风</span>
    </div>
    <div class="mode-badge" id="mode-badge">松林雪夜 · 炉火已燃</div>
    <button id="btn-quality" class="quality-button" type="button" aria-label="切换画质">画质 · 自适应</button>
  </aside>

  <p class="poem">雪落无声，柴火轻响。</p>

  <div class="dock">
    <div class="hint" id="hint">拖动环视 · 滚轮拉近 · 点击木门进屋</div>
    <div class="dock-row">
      <button id="btn-main" class="pill" type="button" aria-label="推门进入木屋">
        <span>推门而入</span>
        <svg class="arrow" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-walk" class="pill walk-pill" type="button" aria-label="切换自由漫步模式"><span>自由漫步</span><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="14" cy="4" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m7 11 4-4 4 1 3 4M12 8l-2 7-4 6m4-6 5 2 1 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="btn-fire" class="round" type="button" title="添一把柴" aria-label="添柴">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 3c1.5 3.2-.8 4.4-.8 6.6 0 1.4 1 2.3 2.2 2.3 1.8 0 2.8-1.6 2.5-3.7 2 1.8 3.1 4.1 3.1 6.4A7 7 0 0 1 5 14.6C5 10 8.4 6.5 12 3Z" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M9.2 15.6c0-2 1.6-3.1 2.4-4.7.7 1.9 2.2 2.8 2.2 4.7a2.4 2.4 0 1 1-4.8 0Z" fill="currentColor" opacity=".55"/></svg>
        <span class="sr-only">添柴</span>
      </button>
      <button id="btn-sound" class="round sound" type="button" title="环境声音" aria-label="开启或关闭环境声音" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 9.5h3l4.2-3.4v11.8L7 14.5H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M15 8.6c1 .9 1.6 2.1 1.6 3.4s-.6 2.5-1.6 3.4M17.8 6c1.6 1.5 2.5 3.6 2.5 6s-.9 4.5-2.5 6" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><path d="M3 3l18 18" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" class="off-line"/></svg>
        <span class="sr-only">声音关</span>
      </button>
    </div>
  </div>

  <div id="door-tooltip" role="status"><span>轻推木门</span><i></i></div>
  <div id="toast" role="status"></div>
  <div id="walk-reticle" aria-hidden="true"><i></i></div>
  <div id="walk-pad" aria-label="漫步移动控制">
    <button data-move="up" aria-label="向前走">↑</button>
    <button data-move="left" aria-label="向左走">←</button>
    <button data-move="down" aria-label="向后走">↓</button>
    <button data-move="right" aria-label="向右走">→</button>
  </div>

  <footer class="credit">风雪在外，灯火在家。</footer>

</div>
<!--__INVITATION__-->
<noscript><div class="noscript">请开启 JavaScript 来走进这间雪夜木屋。</div></noscript>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
